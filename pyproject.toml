[project]
name = "dct"
version = "0.2.0"
description = "Does dropout-consistency training make independently trained models agree more? Formalization, forecasts, and a frontier comparison."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.6.0",
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn>=1.7.2",
    "scipy",
    "torch",
]

[dependency-groups]
dev = ["black", "flake8", "isort", "pytest"]

[tool.uv]
package = false

[tool.isort]
profile = "black"
known_first_party = ["dct", "analysis"]
skip_gitignore = true

[tool.pytest.ini_options]
pythonpath = ["."]
